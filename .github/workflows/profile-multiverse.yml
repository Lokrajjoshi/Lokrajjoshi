name: Refresh Project Multiverse Visuals

on:
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate and refresh profile assets
        run: python scripts/generate_profile_assets.py

      - name: Commit changed visual metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/activity/contribution-fx.svg
          git diff --cached --quiet || git commit -m "Refresh Project Multiverse activity layer"
          git push
