<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" role="img" aria-labelledby="title desc">
<title id="title">LJ operations capability deck</title>
<desc id="desc">Four animated capability panels for signal intelligence, systems, validation, and reliability operations.</desc>
<defs><linearGradient id="b" x1="0" x2="1"><stop stop-color="#050b14"/><stop offset=".5" stop-color="#10233b"/><stop offset="1" stop-color="#190e35"/></linearGradient><pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#38bdf8" stroke-opacity=".07"/></pattern></defs>
<rect width="1200" height="240" rx="24" fill="url(#b)" stroke="#23405b"/><rect width="1200" height="240" rx="24" fill="url(#g)"/>
<text x="42" y="36" fill="#67e8f9" font-family="Consolas,monospace" font-size="11" letter-spacing="3">LJ SIGNAL OPERATIONS // CAPABILITY DECK</text>
<g font-family="Segoe UI,Arial,sans-serif">
<g transform="translate(40 66)"><rect width="260" height="130" rx="15" fill="#08172b" stroke="#22d3ee"/><circle cx="28" cy="28" r="7" fill="#22d3ee"><animate attributeName="opacity" values=".25;1;.25" dur="2s" repeatCount="indefinite"/></circle><text x="48" y="33" fill="#e9f3ff" font-size="15" font-weight="800">SIGNAL INTELLIGENCE</text><text x="22" y="68" fill="#7dd3fc" font-family="Consolas,monospace" font-size="10">SQL · VALIDATION · REPORTING</text><text x="22" y="92" fill="#8ba6bf" font-size="11">Turn unclear data into insight.</text></g>
<g transform="translate(320 66)"><rect width="260" height="130" rx="15" fill="#0b1733" stroke="#60a5fa"/><circle cx="28" cy="28" r="7" fill="#60a5fa"><animate attributeName="opacity" values=".25;1;.25" dur="2.4s" repeatCount="indefinite"/></circle><text x="48" y="33" fill="#e9f3ff" font-size="15" font-weight="800">SYSTEMS GARAGE</text><text x="22" y="68" fill="#93c5fd" font-family="Consolas,monospace" font-size="10">PYTHON · APIs · MERN</text><text x="22" y="92" fill="#8ba6bf" font-size="11">Build practical technical systems.</text></g>
<g transform="translate(600 66)"><rect width="260" height="130" rx="15" fill="#18183b" stroke="#a78bfa"/><circle cx="28" cy="28" r="7" fill="#a78bfa"><animate attributeName="opacity" values=".25;1;.25" dur="2.8s" repeatCount="indefinite"/></circle><text x="48" y="33" fill="#f1edff" font-size="15" font-weight="800">VALIDATION CONTROL</text><text x="22" y="68" fill="#c4b5fd" font-family="Consolas,monospace" font-size="10">SELENIUM · POSTMAN · CI</text><text x="22" y="92" fill="#8ba6bf" font-size="11">Test before systems ship.</text></g>
<g transform="translate(880 66)"><rect width="260" height="130" rx="15" fill="#0d2c2d" stroke="#2dd4bf"/><circle cx="28" cy="28" r="7" fill="#2dd4bf"><animate attributeName="opacity" values=".25;1;.25" dur="3.2s" repeatCount="indefinite"/></circle><text x="48" y="33" fill="#e6fffb" font-size="15" font-weight="800">RELIABILITY DECK</text><text x="22" y="68" fill="#99f6e4" font-family="Consolas,monospace" font-size="10">OPS · DOCS · DELIVERY</text><text x="22" y="92" fill="#8ba6bf" font-size="11">Make workflows dependable.</text></g>
</g></svg>