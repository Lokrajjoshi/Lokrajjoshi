  <text x="0" y="28" text-anchor="middle" fill="#67e8f9" font-family="Consolas,monospace" font-size="11" letter-spacing="3">IDENTITY CORE</text>
  <g transform="translate(118 -18)" filter="url(#glow)">
  <circle r="42" fill="#071428" stroke="#67e8f9" stroke-width="2"/>
  <image x="-35" y="-42" width="70" height="84" preserveAspectRatio="xMidYMid slice" clip-path="url(#portraitClip)" href="https://raw.githubusercontent.com/Lokrajjoshi/Lokrajjoshi/main/assets/lokraj-joshi-portrait.jpg"/>
  <circle r="36" fill="none" stroke="#dffcff" stroke-opacity=".75"/>
  <text y="57" text-anchor="middle" fill="#67e8f9" font-family="Consolas,monospace" font-size="8" letter-spacing="1">LOKRAJ / LJ</text>
</g>
  <circle cx="202" cy="-50" r="8" fill="#22d3ee" filter="url(#glow)"><animate attributeName="opacity" values=".35;1;.35" dur="2s" repeatCount="indefinite"/></circle>
  <circle cx="-140" cy="-92" r="6" fill="#a78bfa" filter="url(#glow)"><animate attributeName="opacity" values="1;.3;1" dur="2.8s" repeatCount="indefinite"/></circle>
<g transform="translate(0 0)" filter="url(#glow)"><circle r="7" fill="#22d3ee"><animateMotion dur="7s" repeatCount="indefinite" path="M -235,-12 C -160,-112 115,-120 235,-12 C 130,88 -135,92 -235,-12 Z"/></circle><text x="11" y="4" fill="#67e8f9" font-family="Consolas,monospace" font-size="9" letter-spacing="1">LJ</text></g>
</g>
<g font-family="Consolas,monospace" font-size="11" letter-spacing="1.4">
  <g transform="translate(86 188)"><rect width="210" height="78" rx="14" fill="#08172b" stroke="#22d3ee" stroke-opacity=".55"/><circle cx="24" cy="24" r="5" fill="#22d3ee"/><text x="42" y="28" fill="#e2f8ff">DATA &amp; BUSINESS</text><text x="24" y="53" fill="#7dd3fc">ANALYSIS SIGNAL</text></g>
  <g transform="translate(904 188)"><rect width="210" height="78" rx="14" fill="#08172b" stroke="#8b5cf6" stroke-opacity=".55"/><circle cx="24" cy="24" r="5" fill="#a78bfa"/><text x="42" y="28" fill="#f1edff">QUALITY ENGINEERING</text><text x="24" y="53" fill="#c4b5fd">TEST • VERIFY • SHIP</text></g>
  <g transform="translate(132 328)"><rect width="220" height="66" rx="14" fill="#08172b" stroke="#3b82f6" stroke-opacity=".45"/><text x="22" y="27" fill="#bfdbfe">TECHNICAL SOLUTIONS</text><text x="22" y="48" fill="#60a5fa">SYSTEMS • API • DATA</text></g>
  <g transform="translate(848 328)"><rect width="220" height="66" rx="14" fill="#08172b" stroke="#14b8a6" stroke-opacity=".45"/><text x="22" y="27" fill="#ccfbf1">OPERATIONAL IMPACT</text><text x="22" y="48" fill="#5eead4">CLARITY • RELIABILITY</text></g>
</g>
<g stroke="url(#line)" stroke-width="2" fill="none" stroke-dasharray="7 9">
  <path d="M296 228 C410 228 438 232 505 232"><animate attributeName="stroke-dashoffset" values="0;-64" dur="3s" repeatCount="indefinite"/></path>
  <path d="M695 232 C770 232 807 228 904 228"><animate attributeName="stroke-dashoffset" values="0;-64" dur="3.4s" repeatCount="indefinite"/></path>
  <path d="M352 360 C440 340 467 310 524 286"><animate attributeName="stroke-dashoffset" values="0;-64" dur="4s" repeatCount="indefinite"/></path>
  <path d="M676 286 C738 314 770 344 848 360"><animate attributeName="stroke-dashoffset" values="0;-64" dur="3.7s" repeatCount="indefinite"/></path>
</g>
<rect x="330" y="40" width="540" height="58" rx="29" fill="#071326" stroke="#38bdf8" stroke-opacity=".22"/>
<text x="600" y="78" text-anchor="middle" fill="url(#word)" font-family="Segoe UI,Arial,sans-serif" font-size="34" font-weight="700" letter-spacing="9">LOKRAJ JOSHI</text>
<text x="600" y="454" text-anchor="middle" fill="#8bdcf3" font-family="Consolas,monospace" font-size="12" letter-spacing="3">PROJECT MULTIVERSE / BENGALURU / ONLINE</text>
<rect x="-260" y="0" width="180" height="520" fill="url(#line)" opacity=".08" transform="skewX(-18)">
  <animate attributeName="x" values="-260;1400" dur="7s" repeatCount="indefinite"/>
</rect>
</g>
<rect x="1" y="1" width="1198" height="518" rx="27" fill="none" stroke="#38bdf8" stroke-opacity=".28"/>
</svg>