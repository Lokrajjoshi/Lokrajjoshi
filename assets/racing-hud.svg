<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 220" role="img" aria-labelledby="title desc">
<title id="title">LJ Signal Racing telemetry</title>
<desc id="desc">Animated racing HUD with an LJ signal vehicle moving through analysis, quality, and delivery telemetry.</desc>
<defs>
<linearGradient id="bg" x1="0" x2="1"><stop stop-color="#050b14"/><stop offset=".52" stop-color="#111f38"/><stop offset="1" stop-color="#1b103c"/></linearGradient>
<linearGradient id="lane"><stop stop-color="#22d3ee" stop-opacity="0"/><stop offset=".5" stop-color="#67e8f9"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/></linearGradient>
<linearGradient id="car" x1="0" x2="1"><stop stop-color="#22d3ee"/><stop offset=".5" stop-color="#60a5fa"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
<pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#38bdf8" stroke-opacity=".08"/></pattern>
<filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1200" height="220" rx="24" fill="url(#bg)" stroke="#23405b"/>
<rect width="1200" height="220" rx="24" fill="url(#grid)"/>
<text x="44" y="42" fill="#67e8f9" font-family="Consolas,monospace" font-size="11" letter-spacing="3">LJ SIGNAL RACING // PROJECT MULTIVERSE TELEMETRY</text>
<text x="44" y="72" fill="#e9f3ff" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="800">DATA → SYSTEMS → QUALITY</text>
<text x="44" y="94" fill="#8ba6bf" font-family="Consolas,monospace" font-size="10" letter-spacing="1.5">ANALYZE / VALIDATE / SHIP / REPEAT</text>
<g stroke="url(#lane)" fill="none">
<path d="M44 140H1156" stroke-width="2"/><path d="M44 173H1156" stroke-width="1"/>
<path d="M44 126H1156" stroke="#60a5fa" stroke-opacity=".15" stroke-dasharray="3 12"/>
</g>
<g transform="translate(120 125)" filter="url(#glow)">
<path d="M-46 22L-35 0H-10L2-16H31L48 0H58L65 22Z" fill="url(#car)" stroke="#dffcff" stroke-width="1.5"/>
<path d="M5-13H27L39 0H-2Z" fill="#071428" stroke="#67e8f9"/>
<circle cx="-27" cy="23" r="9" fill="#050b14" stroke="#67e8f9" stroke-width="3"/><circle cx="37" cy="23" r="9" fill="#050b14" stroke="#a78bfa" stroke-width="3"/>
<text x="5" y="13" text-anchor="middle" fill="#07111f" font-family="Consolas,monospace" font-size="10" font-weight="900">LJ</text>
<animateMotion dur="7s" repeatCount="indefinite" path="M 0,0 C 180,-20 300,20 470,0 C 650,-25 800,18 1010,0"/>
</g>
<g font-family="Consolas,monospace" font-size="10" font-weight="800">
<g transform="translate(520 118)"><rect width="142" height="42" rx="10" fill="#0b2340" stroke="#22d3ee"/><text x="71" y="26" text-anchor="middle" fill="#67e8f9">ANALYZE</text></g>
<g transform="translate(680 118)"><rect width="142" height="42" rx="10" fill="#18183b" stroke="#a78bfa"/><text x="71" y="26" text-anchor="middle" fill="#c4b5fd">VALIDATE</text></g>
<g transform="translate(840 118)"><rect width="142" height="42" rx="10" fill="#0d2c2d" stroke="#2dd4bf"/><text x="71" y="26" text-anchor="middle" fill="#99f6e4">SHIP</text></g>
</g>
<circle cx="1100" cy="52" r="6" fill="#22d3ee"><animate attributeName="opacity" values=".25;1;.25" dur="1.8s" repeatCount="indefinite"/></circle>
<text x="1115" y="56" fill="#67e8f9" font-family="Consolas,monospace" font-size="10">ONLINE</text>
</svg>