<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
  <title id="title">Lokraj Joshi credential deck</title>
  <desc id="desc">Animated 3D-style credential deck showing MCA at CHRIST University, one full year at Dell Technologies, former SAP Labs India intern, and Dell Campus Ambassador.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#050816"/><stop offset=".5" stop-color="#0b1735"/><stop offset="1" stop-color="#07111f"/></linearGradient>
    <linearGradient id="edge" x1="0" x2="1"><stop stop-color="#22d3ee"/><stop offset=".5" stop-color="#60a5fa"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#67e8f9"/><stop offset=".45" stop-color="#2563eb"/><stop offset="1" stop-color="#7c3aed"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#38bdf8" stroke-opacity=".08"/></pattern>
    <filter id="glow"><feGaussianBlur stdDeviation="5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="18"/></filter>
    <clipPath id="clip"><rect width="1200" height="330" rx="24"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="1200" height="330" fill="url(#bg)"/>
    <rect width="1200" height="330" fill="url(#grid)"/>
    <ellipse cx="600" cy="177" rx="274" ry="88" fill="none" stroke="#22d3ee" stroke-opacity=".2"/>
    <ellipse cx="600" cy="177" rx="210" ry="62" fill="none" stroke="#8b5cf6" stroke-opacity=".2"/>
    <path d="M90 274H1110" stroke="url(#edge)" stroke-opacity=".45"/>
    <path d="M190 55H430M770 55H1010" stroke="url(#edge)" stroke-opacity=".35"/>
    <text x="600" y="32" text-anchor="middle" fill="#67e8f9" font-family="Consolas,monospace" font-size="10" letter-spacing="4">LJ // CREDENTIAL DECK // ONLINE</text>

    <g transform="translate(600 167)" filter="url(#glow)">
      <circle r="54" fill="#22d3ee" opacity=".12"><animate attributeName="r" values="48;60;48" dur="4s" repeatCount="indefinite"/></circle>
      <circle r="42" fill="url(#core)" opacity=".9"/>
      <path d="M-38 18L0 43L38 18L0-8Z" fill="#0b1633" opacity=".5" stroke="#a5f3fc" stroke-opacity=".65"/>
      <text y="7" text-anchor="middle" fill="#f0fdff" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="800" letter-spacing="3">LJ</text>
      <text y="25" text-anchor="middle" fill="#dffcff" font-family="Consolas,monospace" font-size="7" letter-spacing="2">IDENTITY CORE</text>
      <animateTransform attributeName="transform" type="rotate" values="0 0 0;2 0 0;0 0 0;-2 0 0;0 0 0" dur="8s" repeatCount="indefinite" additive="sum"/>
    </g>

    <g fill="none" stroke="url(#edge)" stroke-width="1.5" stroke-dasharray="5 9" opacity=".8">
      <path d="M546 150L284 92"><animate attributeName="stroke-dashoffset" values="0;-70" dur="3.2s" repeatCount="indefinite"/></path>
      <path d="M654 150L916 92"><animate attributeName="stroke-dashoffset" values="0;-70" dur="3.6s" repeatCount="indefinite"/></path>
      <path d="M546 185L284 242"><animate attributeName="stroke-dashoffset" values="0;-70" dur="4s" repeatCount="indefinite"/></path>
      <path d="M654 185L916 242"><animate attributeName="stroke-dashoffset" values="0;-70" dur="4.4s" repeatCount="indefinite"/></path>
    </g>

    <g font-family="Segoe UI,Arial,sans-serif">
      <g transform="translate(108 55)">
        <rect width="350" height="72" rx="12" fill="#0b1633" stroke="#22d3ee" stroke-opacity=".65"/>
        <rect width="5" height="72" rx="2" fill="#22d3ee"/>
        <circle cx="25" cy="25" r="8" fill="#22d3ee"><animate attributeName="opacity" values=".35;1;.35" dur="2.2s" repeatCount="indefinite"/></circle>
        <text x="47" y="28" fill="#dffcff" font-size="12" font-weight="700">MCA @ CHRIST University</text>
        <text x="47" y="49" fill="#7dd3fc" font-family="Consolas,monospace" font-size="9" letter-spacing="1.5">SYSTEMS • ANALYSIS • DELIVERY</text>
      </g>
      <g transform="translate(742 55)">
        <rect width="350" height="72" rx="12" fill="#0b1633" stroke="#a78bfa" stroke-opacity=".7"/>
        <rect x="345" width="5" height="72" rx="2" fill="#a78bfa"/>
        <circle cx="25" cy="25" r="8" fill="#a78bfa"><animate attributeName="opacity" values=".35;1;.35" dur="2.5s" repeatCount="indefinite"/></circle>
        <text x="47" y="28" fill="#f1edff" font-size="12" font-weight="700">Former SAP Labs India Intern</text>
        <text x="47" y="49" fill="#c4b5fd" font-family="Consolas,monospace" font-size="9" letter-spacing="1.5">AUTOMATION • QUALITY • APIs</text>
      </g>
      <g transform="translate(108 205)">
        <rect width="350" height="72" rx="12" fill="#0b1633" stroke="#60a5fa" stroke-opacity=".7"/>
        <rect width="5" height="72" rx="2" fill="#60a5fa"/>
        <circle cx="25" cy="25" r="8" fill="#60a5fa"><animate attributeName="opacity" values=".35;1;.35" dur="2.8s" repeatCount="indefinite"/></circle>
        <text x="47" y="28" fill="#e0f2fe" font-size="12" font-weight="700">1 full year @ Dell Technologies</text>
        <text x="47" y="49" fill="#93c5fd" font-family="Consolas,monospace" font-size="9" letter-spacing="1.5">TECHNICAL SUPPORT • CSAT • SYSTEMS</text>
      </g>
      <g transform="translate(742 205)">
        <rect width="350" height="72" rx="12" fill="#0b1633" stroke="#2dd4bf" stroke-opacity=".7"/>
        <rect x="345" width="5" height="72" rx="2" fill="#2dd4bf"/>
        <circle cx="25" cy="25" r="8" fill="#2dd4bf"><animate attributeName="opacity" values=".35;1;.35" dur="3.1s" repeatCount="indefinite"/></circle>
        <text x="47" y="28" fill="#e6fffb" font-size="12" font-weight="700">Dell Campus Ambassador</text>
        <text x="47" y="49" fill="#99f6e4" font-family="Consolas,monospace" font-size="9" letter-spacing="1.5">COMMUNITY • OUTREACH • LEADERSHIP</text>
      </g>
    </g>
    <g fill="#e0f2fe"><circle cx="70" cy="28" r="1.4"><animate attributeName="opacity" values=".2;1;.2" dur="2.7s" repeatCount="indefinite"/></circle><circle cx="1135" cy="38" r="1.2"><animate attributeName="opacity" values="1;.2;1" dur="3.3s" repeatCount="indefinite"/></circle></g>
  </g>
</svg>
