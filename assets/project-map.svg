<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img" aria-labelledby="t d">
<title id="t">Lokraj Joshi Project Multiverse Map</title><desc id="d">Animated map connecting CarePulse, Student LMS, Project Tracker, E-Commerce and Dell Trivia projects.</desc>
<defs>
